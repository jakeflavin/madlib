<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      content="Twelve long fantasy stories with the best words missing. Give them yours, then read the whole ridiculous thing aloud."
    />

    <!-- Link previews. The image is the app's own cover shot, served from the directory
         that hosts it; crawlers need an absolute URL and will not follow a relative one. -->
    <meta property="og:title" content="Fable — fantasy mad libs" />
    <meta property="og:description" content="Twelve long fantasy stories with the best words missing. Give them yours, then read the whole ridiculous thing aloud." />
    <meta property="og:site_name" content="Jake's Portfolio" />
    <meta property="og:image" content="https://portfolio-4b9fe.web.app/images/madlib-cover.jpg" />
    <meta property="og:image:alt" content="Fable — fantasy mad libs" />
    <meta property="og:url" content="https://portfolio-4b9fe.web.app/madlib/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fable — fantasy mad libs" />
    <meta name="twitter:description" content="Twelve long fantasy stories with the best words missing. Give them yours, then read the whole ridiculous thing aloud." />
    <meta name="twitter:image" content="https://portfolio-4b9fe.web.app/images/madlib-cover.jpg" />
    <meta name="twitter:image:alt" content="Fable — fantasy mad libs" />
    <link rel="canonical" href="https://portfolio-4b9fe.web.app/madlib/" />


    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#262a47" />

    <!-- iOS reads its own tags rather than the manifest, and ignores an SVG icon. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fable" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Nunito+Sans:wght@400;600;700;800&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
      <!--
      Resolves the theme before the first paint. Every app switches tokens on
      <html data-theme>, but React only sets it on mount — so without this the page
      paints the light palette first, which is a white flash on a dark screen.
    -->
    <script>
      try {
        var stored = localStorage.getItem('fable.theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark' ? stored : dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
